<article class="card" [class.card--signature]="item().tags?.includes('signature')">
  <header class="card__head">
    <span class="veg-badge" role="img" aria-label="Pure vegetarian"></span>
    <h3 class="card__title">{{ item().name }}</h3>
    @if (item().teluguName) {
      <p class="card__telugu" lang="te">{{ item().teluguName }}</p>
    }
    @if (item().isSpicy) {
      <span class="card__spicy" title="Spicy">Spicy</span>
    }
  </header>
  <p class="card__desc">{{ item().description }}</p>
  @if (tags().length) {
    <ul class="card__tags" role="list">
      @for (t of tags(); track t.tag) {
        <li class="tag" [class]="'tag tag--' + t.tag">{{ t.label }}</li>
      }
    </ul>
  }
</article>
